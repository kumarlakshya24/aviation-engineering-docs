[project]
name = "aviation-engineering-docs"
version = "0.1.0"
description = "Synthetic eVTOL engineering repository: EKF sensor fusion, battery monitoring, CI pipeline, and SOPs for the fictional Halcyon Aero H1."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lakshya Kumar" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The module directories use hyphens, so they are put on the path rather than imported as packages.
pythonpath = ["flight-controller", "battery-management"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
